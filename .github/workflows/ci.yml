name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Load every entry point
        run: |
          node --input-type=module -e "for (const entry of ['totallytics', 'totallytics/hono', 'totallytics/workers', 'totallytics/express', 'totallytics/fastify', 'totallytics/next']) await import(entry)"
          node -e "for (const entry of ['totallytics', 'totallytics/hono', 'totallytics/workers', 'totallytics/express', 'totallytics/fastify', 'totallytics/next']) require(entry)"

      - name: Next.js integration
        run: npm run test:integration
